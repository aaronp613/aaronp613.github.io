name: Deploy static site to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Renders data/*.json into index.html, minifies the MCU assets and stamps the
      # MCU service worker with a content hash. These change the CI checkout only.
      - name: Build
        run: npm run build:ci

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      # Runs against the built (minified) files that are about to ship.
      - name: Smoke tests
        run: npm test

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'node_modules' --exclude 'tests' --exclude 'test-results' \
            --exclude 'playwright-report' --exclude 'scripts' --exclude 'data' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'playwright.config.js'

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
